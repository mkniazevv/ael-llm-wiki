name: Wiki check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tools/lint.py (links, frontmatter, index, quotes in raw sources)
        run: python3 tools/lint.py
